name: Release

on:
  push:
    # Semver tags only. A bare "v*" would also match a moving tag, and re-pointing that tag would
    # republish whatever version happened to be in the tree.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # creating the GitHub Release needs write
      contents: write
      # Trusted publishing (OIDC): no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          from pathlib import Path
          import re
          init = Path("src/ecsodus/__init__.py").read_text(encoding="utf-8")
          project = Path("pyproject.toml").read_text(encoding="utf-8")
          a = re.search(r'__version__ = "(\d+\.\d+\.\d+)"', init)
          b = re.search(r'^version = "(\d+\.\d+\.\d+)"', project, re.M)
          if a is None or b is None or a.group(1) != b.group(1):
              raise SystemExit("version missing or inconsistent between __init__.py and pyproject.toml")
          print(a.group(1))
          PY
          )"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Run the suite before publishing
        # A migration tool that ships broken is worse than one that ships late.
        run: |
          uv sync
          uv run ruff check .
          uv run mypy src
          uv run pytest -q

      - run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --latest \
            --title "ecsodus ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "$(printf '\x60\x60\x60bash\npipx install ecsodus   # or: uvx ecsodus\n\x60\x60\x60\n\nSafely migrate AWS Copilot CLI apps to Terraform-managed ECS. Verified end to end on real AWS (docs/e2e/). Read docs/STATUS.md for the verified scope before running it against production.\n')"
