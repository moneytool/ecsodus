# Concrete render of tests/fixtures/copilot/templates/addons/aurora/cf.yml
# (AWS Copilot CLI, Apache-2.0; see ../copilot/NOTICE-copilot-cli) with ClusterName=db,
# Engine=MySQL, InitialDBName=main, Envs=[test], no ParameterGroup. Security groups omitted.
Parameters:
  App:
    Type: String
  Env:
    Type: String
  Name:
    Type: String
  dbDBName:
    Type: String
    Default: main
  dbDBAutoPauseSeconds:
    Type: Number
    Default: 1000
Mappings:
  dbEnvScalingConfigurationMap:
    All:
      "DBMinCapacity": 1
      "DBMaxCapacity": 8
Resources:
  dbDBSubnetGroup:
    Type: 'AWS::RDS::DBSubnetGroup'
    Properties:
      DBSubnetGroupDescription: Group of Copilot private subnets for Aurora cluster.
      SubnetIds:
        !Split [',', { 'Fn::ImportValue': !Sub '${App}-${Env}-PrivateSubnets' }]
  dbAuroraSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Aurora main user secret for ${AWS::StackName}
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        ExcludePunctuation: true
        IncludeSpace: false
        PasswordLength: 16
  dbDBClusterParameterGroup:
    Type: 'AWS::RDS::DBClusterParameterGroup'
    Properties:
      Description: !Ref 'AWS::StackName'
      Family: 'aurora-mysql5.7'
      Parameters:
        character_set_client: 'utf8'
  dbDBCluster:
    Type: 'AWS::RDS::DBCluster'
    Properties:
      MasterUsername:
        !Join [ "",  [ '{{resolve:secretsmanager:', !Ref dbAuroraSecret, ":SecretString:username}}" ]]
      MasterUserPassword:
        !Join [ "",  [ '{{resolve:secretsmanager:', !Ref dbAuroraSecret, ":SecretString:password}}" ]]
      DatabaseName: !Ref dbDBName
      Engine: 'aurora-mysql'
      EngineVersion: '5.7.mysql_aurora.2.07.1'
      EngineMode: serverless
      DBClusterParameterGroupName: !Ref dbDBClusterParameterGroup
      DBSubnetGroupName: !Ref dbDBSubnetGroup
      ScalingConfiguration:
        AutoPause: true
        MinCapacity: !FindInMap [dbEnvScalingConfigurationMap, All, DBMinCapacity]
        MaxCapacity: !FindInMap [dbEnvScalingConfigurationMap, All, DBMaxCapacity]
        SecondsUntilAutoPause: !Ref dbDBAutoPauseSeconds
  dbSecretAuroraClusterAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref dbAuroraSecret
      TargetId: !Ref dbDBCluster
      TargetType: AWS::RDS::DBCluster
