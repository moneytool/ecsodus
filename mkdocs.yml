site_name: ecsodus — migrate AWS Copilot CLI apps to Terraform
site_url: https://moneytool.github.io/ecsodus/
site_description: >-
  ecsodus safely migrates AWS Copilot CLI applications (end of support 2026-06-12) to
  Terraform-managed Amazon ECS: adopt in place, import every resource, and delete the Copilot
  CloudFormation stacks without deleting your infrastructure or data.
site_author: Vamshidher Reddy Jannapu Reddy
repo_url: https://github.com/moneytool/ecsodus
repo_name: moneytool/ecsodus
edit_uri: edit/main/docs/
copyright: Apache-2.0 · ecsodus is not affiliated with Amazon Web Services or GitHub.

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

hooks:
  - docs_hooks/lists.py

plugins:
  - search

# Every link must resolve on the site: unrecognised (e.g. directory) links are warnings, so
# `mkdocs build --strict` in CI fails on them.
validation:
  omitted_files: info  # ADRs and reviews are reached through links, not the nav
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

exclude_docs: |
  assets/*.tape

nav:
  - Home: index.md
  - AWS Copilot CLI end of support: copilot-end-of-support.md
  - Migrate AWS Copilot to Terraform: migrate-copilot-to-terraform.md
  - FAQ: faq.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - How it works: guides/how-it-works.md
  - Workload types:
      - Overview: workloads/index.md
      - Load Balanced Web Service: workloads/load-balanced-web-service.md
      - Backend Service: workloads/backend-service.md
      - Worker Service: workloads/worker-service.md
      - Scheduled Job: workloads/scheduled-job.md
      - Request-Driven Web Service: workloads/request-driven-web-service.md
      - Static Site: workloads/static-site.md
  - Copilot internals:
      - Custom resources and their Delete handlers: knowledge/copilot-custom-resources.md
      - Stack layering: knowledge/copilot-stacks.md
  - Evidence:
      - AWS end-to-end run (2026-09-30): e2e/2026-09-30-aws-e2e.md
      - Example report: examples/copilot-lbws-aurora/REPORT.md
      - Example runbook: examples/copilot-lbws-aurora/RUNBOOK.md
      - Status: STATUS.md
  - Design:
      - Plan: PLAN.md
      - Decisions (ADRs): adr/README.md
      - Council reviews: council/README.md
      - Code reviews: council/code-review-v0.1/README.md

extra:
  version: 0.1.2
  doi: 10.5281/zenodo.23073590
  author_orcid: https://orcid.org/0009-0005-1167-2026
  social_image: assets/social-preview.png
  # Sitemap discovery: crawlers only read robots.txt at the host root (moneytool.github.io), which
  # this project site cannot serve, so sitemap.xml is submitted in Google Search Console instead.
  # Google Search Console ownership check: the HTML-tag token for the property
  # https://moneytool.github.io/ecsodus/ (emitted on every page by overrides/main.html).
  google_site_verification: "4zZRo_MaoDmUuxMhkdR0dvvvv9t_i4m7PBJyIAvlH-M"
